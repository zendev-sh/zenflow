name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel stale CI runs when a new commit lands on the same branch /
# PR head. main pushes do not auto-cancel (cancel-in-progress is
# false on push events) so a release sequence is not interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build library
        run: go build ./...

      - name: Build CLI
        run: go build ./cmd/zenflow/

      - name: Test (race)
        # Force bash on Windows: PowerShell's argument tokeniser
        # splits any `-flag=path.<ext>` form so that `.<ext>` lands in
        # `go test` as a phantom package (verified with both `.txt`
        # and `.out` extensions). bash on `windows-latest` is provided
        # by GitHub-hosted runners.
        shell: bash
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Smoke-check examples
        if: runner.os != 'Windows'
        run: ./scripts/smoke-examples.sh

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          total=$(go tool cover -func=coverage.out | grep ^total | awk '{print $3}')
          echo "Coverage: $total"

      - name: Upload to Codecov
        # `fail_ci_if_error: false` for now: the repo is private during
        # the soak window and the org-level CODECOV_TOKEN does not yet
        # exist on `zendev-sh/zenflow`. Coverage upload is a signal,
        # not a gate; flipping back to true is a follow-up once the
        # repo is public and the token is in place.
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2

      - name: go vet
        run: go vet ./...

  schema:
    name: spec/v1 schema conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Run schema test harness
        working-directory: spec/v1
        run: bash test_schema.sh
